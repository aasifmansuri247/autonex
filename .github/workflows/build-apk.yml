name: Build Android APK

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses & Verify SDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          elif [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          fi

          echo "ANDROID_HOME: $ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/licenses" || true

          yes | sdkmanager --licenses || true

      - name: Install Node dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Ensure Capacitor 7 dependencies installed
        run: |
          npm install --save \
            @capacitor/core@^7.0.0 \
            @capacitor/android@^7.0.0 \
            @capacitor/cli@^7.0.0 \
            --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Add & Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Patch Android Duplicate Classes & Configurations
        run: |
          echo "Configuring Android build settings..."

          # Enable AndroidX and Jetifier
          if [ -f "android/gradle.properties" ]; then
            grep -q "android.useAndroidX" android/gradle.properties || \
              echo "android.useAndroidX=true" >> android/gradle.properties

            grep -q "android.enableJetifier" android/gradle.properties || \
              echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          # Patch Android app Gradle configuration
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "kotlin-stdlib-jdk8" android/app/build.gradle; then
              echo "" >> android/app/build.gradle
              echo "configurations.all {" >> android/app/build.gradle
              echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
              echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
              echo "    exclude group: 'com.google.guava', module: 'listenablefuture'" >> android/app/build.gradle
              echo "}" >> android/app/build.gradle
            fi
          fi
          
      - name: Build Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "::error::Could not find compiled APK in android/app/build/outputs/apk"
            exit 1
          fi

          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoNex-Client-Portal-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
