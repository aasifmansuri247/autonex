<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="anGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16d9ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1426" />
      <stop offset="100%" stop-color="#070b18" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#24304a" stroke-width="6" />
  <circle cx="256" cy="256" r="170" stroke="url(#anGrad)" stroke-width="8" stroke-dasharray="14 10" opacity="0.4" />
  
  <!-- Stylized Hexagonal Neural Node -->
  <polygon points="256,120 376,188 376,324 256,392 136,324 136,188" stroke="url(#anGrad)" stroke-width="14" fill="#0d1325" filter="url(#glow)" />
  
  <!-- Lightning / Pulse A-N glyph -->
  <path d="M190 340 L235 180 L275 180 L320 340 M208 290 L302 290" stroke="url(#anGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="180" r="12" fill="#16d9ff" />
  <circle cx="190" cy="340" r="10" fill="#3b82f6" />
  <circle cx="320" cy="340" r="10" fill="#7c3aed" />
</svg>
